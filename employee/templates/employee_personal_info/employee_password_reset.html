{% load i18n %}

<div class="card rounded-3">
    <form hx-post="{% url 'employee-password-change' form.instance.id %}"
          hx-target="#section"
          hx-swap="innerHTML"
          method="post">
        {% csrf_token %}
        <div class="card-body p-5">
            <h3 class="mb-4">{{ form.instance.employee_first_name }}'s {% trans "Reset Password" %}</h3>

            <div class="row">
                <div class="col-md-6">
                    {{ password_form.new_password.errors }}
                    <div class="form-outline mb-4">
                        {{ password_form.new_password }}
                    </div>
                </div>

                <div class="col-md-6 mb-2">
                    {{ password_form.confirm_password.errors }}
                    <div class="form-outline mb-4">
                        {{ password_form.confirm_password }}
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-success btn-lg">
                    {% trans "Submit" %}
                </button>
            </div>
        </div>
    </form>
</div>
